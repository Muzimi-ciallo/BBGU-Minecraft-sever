name: Update SJMCL modpack manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'modpack/**'
      - 'scripts/generate_sjmcl_update_manifest.py'
      - '.github/workflows/github-actions-update-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate manifest
        run: python scripts/generate_sjmcl_update_manifest.py modpack sjmcl-update.json --base-url "https://v4.gh-proxy.org/https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/modpack"

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sjmcl-update.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
            exit 0
          fi
          git commit -m "chore: update sjmcl-update.json"
          git push
      - name: Sync main to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: Muzimimiao
          GITEE_REPO: BBGU-Minecraft-sever
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main || true
          git remote add gitee "https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          if git push gitee main:main 2>&1; then
            echo "Pushed main to Gitee."
          else
            echo "Non-fast-forward; forcing mirror update..."
            git push --force gitee main:main 2>&1 || echo "Force push failed."
          fi
